name: Link check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/link-check.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/link-check.yml"

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # Some publisher sites reject GitHub-hosted automation or fail HTTP/2
          # even though the links are valid in a normal browser.
          # Exact OpenAI original/localized URLs: browser evidence is recorded
          # in SOURCE-VERIFICATION-2026-10.md (2026-11-08); CI 403s on 2026-11-09.
          args: >-
            --verbose
            --no-progress
            --accept 200,206,429
            --exclude "https://www\.rsaconference\.com/.*"
            --exclude "https://blackhat\.com/.*"
            --exclude "https://www\.akamai\.com/.*"
            --exclude "https://www\.sophos\.com/.*"
            --exclude "https://www\.cloudflare\.com/lp/.*"
            --exclude "^https://devday\.openai\.com/$"
            --exclude "^https://openai\.com/devday/2026/$"
            --exclude "^https://openai\.com/index/devday-2026/$"
            --exclude "^https://openai\.com/index/devday-2026-recap/$"
            --exclude "^https://openai\.com/ja-JP/devday/2026/$"
            --exclude "^https://openai\.com/ja-JP/index/devday-2026/$"
            --exclude "^https://openai\.com/ja-JP/index/devday-2026-recap/$"
            --exclude "^https://investor\.fortinet\.com/news-releases/news-release-details/fortinet-2026-global-threat-landscape-report-reveals-surge-ai/$"
            --exclude "^https://community\.oracle\.com/products/oracleanalytics/discussion/29882/oracle-ai-world-2026-must-attend-sessions-for-aidp-oac-fdi/p1$"
            "**/*.md"
          fail: true
